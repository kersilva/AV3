services:
  db:
    image: postgres:17
    container_name: greencode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode_dev
      POSTGRES_DB: greencode
    ports:
      - '5433:5432'
    volumes:
      - greencode-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greencode -d greencode']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: greencode-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - greencode-redis-data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  greencode-db-data:
  greencode-redis-data:
