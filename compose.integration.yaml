services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: greencode_test
      POSTGRES_PASSWORD: greencode_test
      POSTGRES_DB: greencode_test
    ports:
      - '5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greencode_test -d greencode_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '6379'
    volumes:
      - redis-test-data:/data
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'always']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  redis-test-data:
